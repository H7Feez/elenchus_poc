<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="{{styleUri}}" rel="stylesheet">
  <title>Socratic Tutor</title>
</head>
<body>
  <header>
    <h1>Socratic Tutor</h1>
    <span id="model" class="model">—</span>
  </header>

  <div class="toolbar">
    <div id="modes" class="modes" role="radiogroup" aria-label="How much help for the next reply"></div>
    <div class="toolbar-actions">
      <button id="reHighlight" class="ghost" title="Put the highlight back in the editor">Re-highlight</button>
      <button id="restart" class="ghost">Clear history</button>
    </div>
  </div>
  <p id="modeNote" class="mode-note"></p>

  <div id="empty" class="empty">
    <p>Select some code in the editor, right-click, and choose
       <strong>Ask Socratic Tutor</strong> — or press <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>S</kbd>.</p>
    <p class="empty-note">Type a question if you have one, then pick how much help you want.
       The row above changes the mode for follow-up replies.</p>
  </div>

  <main id="history" role="log" aria-live="polite" aria-label="Conversation"></main>

  <div id="busy" class="busy" hidden>thinking…</div>

  <div id="composer" class="composer" hidden>
    <textarea id="reply" rows="2" spellcheck="false" data-autogrow data-max="200"
              placeholder="Reply, ask a question, or say you're stuck. Enter to send, Shift+Enter for a new line."></textarea>
    <button id="send" class="primary">Send</button>
  </div>

  <div id="notice" class="notice" hidden></div>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
